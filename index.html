<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flag Practice</title>
<style>
:root{--text:#333;--mute:#777;--line:#ddd;--good:#78b05a;--blue:#2f61c9}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font:17px/1.4 Georgia,"Times New Roman",serif}
button,input{font-family:Arial,Helvetica,sans-serif}
#side{position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:18px 16px 40px;z-index:30;transition:transform .25s;box-shadow:2px 0 8px rgba(0,0,0,.06)}
body.collapsed #side{transform:translateX(-100%);box-shadow:none}
#tab{position:fixed;top:90px;left:310px;z-index:31;background:#fff;border:1px solid var(--line);border-left:none;border-radius:0 10px 10px 0;padding:14px 8px;cursor:pointer;writing-mode:vertical-rl;font:15px Georgia,serif;color:var(--text);box-shadow:2px 2px 5px rgba(0,0,0,.12);transition:left .25s}
body.collapsed #tab{left:0}
#tab:hover{background:#f4f4f4}
#side h2{margin:0 0 4px;font-size:20px;font-weight:normal}
.pool{color:var(--mute);font-size:14px;margin-bottom:6px}
.cat{margin-top:14px}
.cat .label{color:var(--mute);font-size:14px;margin-bottom:5px}
.cat .label b{font-weight:normal}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid #bbb;background:#fff;border-radius:8px;padding:4px 9px;font-size:13px;cursor:pointer;user-select:none;font-family:Arial,sans-serif}
.chip:hover{border-color:#666}
.chip.on{background:#99d37d;border-color:#7ab85f}
.chip.all{font-weight:bold}
.chip small{opacity:.55;margin-left:4px}
.tools{margin-top:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.tools label{display:flex;gap:6px;align-items:flex-start;cursor:pointer;width:100%}
main{max-width:760px;margin:0 auto;padding:22px 20px 70px;transition:margin .25s}
@media(min-width:1180px){body:not(.collapsed) main{margin-left:calc(310px + (100vw - 310px - 760px)/2)}}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:30px;font-weight:normal;margin:0}
.stats{color:var(--mute);font-size:14px}
.stats b{color:var(--text)}
.lbl{font-size:18px;margin-bottom:6px}
.box{position:relative}
input[type=text]{width:100%;height:58px;font:22px Arial,Helvetica,sans-serif;padding:0 52px 0 10px;border:2px solid #666;border-radius:8px;background:#fff;color:#111}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.box:after{content:"";position:absolute;right:16px;top:23px;border:13px solid transparent;border-top:17px solid #000;border-bottom:0;pointer-events:none}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:#fff;border:2px solid #666;border-radius:8px;max-height:300px;overflow:auto;z-index:20;display:none;font:19px Arial,sans-serif}
.dd div{padding:8px 12px;cursor:pointer}
.dd div.sel,.dd div:hover{background:#e6eefc}
.btns{display:flex;gap:10px;margin-top:10px}
.btns button{height:56px;border-radius:12px;border:3px solid #999;font-size:22px;text-transform:uppercase;cursor:pointer;box-shadow:1px 2px 3px rgba(0,0,0,.35);color:#111}
#btnGuess{flex:1;background:#99d37d}
#btnGive{background:#dcdad6;padding:0 22px}
#btnNext{flex:1;background:#99d37d}
.btns button:hover{filter:brightness(.96)}
.msg{color:var(--mute);font-size:15px;min-height:22px;margin:10px 0 2px}
.msg.err{color:#c33}
.legend{display:flex;gap:16px;color:var(--mute);font-size:14px;align-items:center;flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.target{margin:0}
.target:has(.answer.show){margin:6px 0 20px}
.mystery{width:225px;height:150px;border:2px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:44px;color:#bbb;background:#fafafa}
.answer{display:none}
.answer.show{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.answer h2{margin:0 0 8px;font-size:26px;font-weight:normal}
.answer h2 span{display:block;color:var(--mute);font-size:15px}
.flag{width:225px;height:150px;object-fit:contain;background:#e8e8e8;box-shadow:2px 3px 6px rgba(0,0,0,.35);display:block}
canvas.map{width:120px;height:80px;display:block;background:#eef2f5;border:1px solid #ccc}
.row{display:grid;grid-template-columns:110px 160px 160px 120px;gap:14px;align-items:center;margin:26px 0;justify-content:start}
.row .info{text-align:right}
.rname{font-size:23px;line-height:1.15}
.rsub,.pct{font-size:14px;color:var(--mute)}
.row.win .rname{color:#3d8a2a}
.row img.gf{width:160px;height:107px;object-fit:contain;background:#e8e8e8;box-shadow:2px 3px 6px rgba(0,0,0,.35);display:block}
.row canvas.sim{width:160px;height:107px;box-shadow:2px 3px 6px rgba(0,0,0,.35);display:block}
@media(max-width:700px){
  .row{grid-template-columns:1fr 1fr;}
  .row .info{grid-column:1/-1;text-align:left;order:-1}
  .row canvas.map{grid-column:1/-1}
}
</style>
</head>
<body>
<button id="tab" title="Show / hide categories">Categories</button>
<aside id="side">
  <h2>Categories</h2>
  <div class="pool" id="poolInfo"></div>
  <div id="cats"></div>
  <div class="tools">
    <button id="btnAll" class="chip">Whole world</button>
    <button id="btnNone" class="chip">Clear</button>
    <label><input type="checkbox" id="limitChoices" checked> <span>Only offer countries from my selection as answers</span></label>
  </div>
</aside>
<main>
  <header><h1>Flag Practice</h1><div class="stats" id="stats"></div></header>
  <div class="target">
    <div class="answer" id="answer">
      <img id="ansFlag" class="flag" alt="">
      <div><h2 id="ansName"></h2><canvas id="ansMap" class="map" width="360" height="240"></canvas></div>
    </div>
  </div>
  <div class="lbl">Search for a flag...</div>
  <div class="box">
    <input type="text" id="q" placeholder="" autocomplete="off" spellcheck="false" aria-label="Search for a flag">
    <div class="dd" id="dd"></div>
  </div>
  <div class="btns">
    <button id="btnGuess">Guess</button>
    <button id="btnGive">Give up</button>
    <button id="btnNext" style="display:none">Next flag →</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="legend">
    <span><span class="sw" style="background:#78b05a"></span>same colour in the same spot as the mystery flag</span>
    <span><span class="sw" style="background:#1f1f1f"></span>different</span>
  </div>
  <div id="guesses"></div>
</main>
<script src="lib/d3-array.min.js"></script>
<script src="lib/d3-geo.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="data.js"></script>
<script>
/* ---------- categories ---------- */
const GROUPS=[
 {id:'africa',name:'Africa',subs:[
  {name:'North Africa',sr:['Northern Africa']},
  {name:'West Africa',sr:['Western Africa']},
  {name:'East Africa',sr:['Eastern Africa']},
  {name:'Central & Southern Africa',sr:['Middle Africa','Southern Africa']}]},
 {id:'europe',name:'Europe',subs:[
  {name:'Northern Europe',sr:['Northern Europe']},
  {name:'Western & Central Europe',sr:['Western Europe','Central Europe']},
  {name:'Southern Europe',sr:['Southern Europe']},
  {name:'Balkans & Eastern Europe',sr:['Southeast Europe','Eastern Europe']}]},
 {id:'asia',name:'Asia',subs:[
  {name:'Middle East & Caucasus',sr:['Western Asia']},
  {name:'Central & South Asia',sr:['Central Asia','Southern Asia']},
  {name:'East Asia',sr:['Eastern Asia']},
  {name:'Southeast Asia',sr:['South-Eastern Asia']}]},
 {id:'na',name:'North America',subs:[
  {name:'North & Central America',sr:['North America','Central America']},
  {name:'Caribbean',sr:['Caribbean']}]},
 {id:'sa',name:'South America',subs:[
  {name:'South America',sr:['South America']}]},
 {id:'oce',name:'Oceania',subs:[
  {name:'Australia, NZ & Melanesia',sr:['Australia and New Zealand','Melanesia']},
  {name:'Micronesia & Polynesia',sr:['Micronesia','Polynesia']}]},
 {id:'theme',name:'By theme',subs:[
  {name:"Moon / crescent",codes:["dz", "az", "bn", "km", "ly", "my", "mv", "mr", "pk", "sg", "tn", "tr", "tm", "uz"]},
  {name:"Triangle on the left",codes:["bs", "cu", "cz", "dj", "er", "gq", "gy", "jo", "km", "mz", "ph", "ps", "sd", "ss", "st", "tl", "vu", "zw"]},
  {name:"Stars",codes:["us", "cn", "vn", "kp", "cu", "cl", "pa", "ve", "br", "hn", "gh", "cm", "sn", "tg", "bf", "gw", "so", "dj", "lr", "ma", "cd", "gq", "st", "mz", "zw", "il", "sy", "jo", "mm", "tr", "az", "uz", "tm", "pk", "sg", "my", "ph", "au", "nz", "pg", "sb", "ws", "tv", "fm", "mh", "ba", "xk", "bi", "km", "dz", "tn", "ly", "mr", "et", "dm", "gd", "kn", "sr", "np"]},
  {name:"Crosses",codes:["dk", "fi", "is", "no", "se", "ch", "gb", "ge", "gr", "mt", "to", "do"]},
  {name:"Sun & circles",codes:["ar", "uy", "jp", "bd", "pw", "la", "mk", "kz", "kg", "ph", "ne", "ag", "rw", "kr", "tw"]},
  {name:"Animals & birds",codes:["al", "mx", "eg", "zm", "ug", "zw", "dm", "pg", "lk", "bt", "md", "rs", "me", "kz", "ec", "ki", "gt", "ad"]},
  {name:"Red, yellow & green",codes:["ml", "gn", "sn", "cm", "gh", "bj", "tg", "et", "gw", "st", "cg", "bf", "bo", "lt"]},
  {name:"Union Jack / blue ensign",codes:["gb", "au", "nz", "fj", "tv"]}]},
];
const C=window.COUNTRIES;
const byCode=Object.fromEntries(C.map(c=>[c.c,c]));
GROUPS.forEach(g=>g.subs.forEach(s=>{s.key=g.id+':'+s.name;s.list=s.codes||C.filter(c=>s.sr.includes(c.sr)).map(c=>c.c)}));
const ALLSUBS=GROUPS.flatMap(g=>g.subs);
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
const ALIAS={'usa':'us','america':'us','uk':'gb','britain':'gb','great britain':'gb','england':'gb','czech republic':'cz','ivory coast':'ci','cote divoire':'ci','swaziland':'sz','burma':'mm','east timor':'tl','turkiye':'tr','congo':'cg','drc':'cd','democratic republic of the congo':'cd','uae':'ae','holland':'nl','macedonia':'mk','cabo verde':'cv','palestine':'ps','vatican':'va','korea':'kr','north korea':'kp','south korea':'kr'};

/* ---------- state ---------- */
let sel=new Set(),target=null,guessed=[],over=false,hi=-1,shown=[];
let stats={games:0,wins:0,guesses:0,streak:0,best:0};
try{
  const s=JSON.parse(localStorage.getItem('fp_sel')||'null');if(s)sel=new Set(s);
  Object.assign(stats,JSON.parse(localStorage.getItem('fp_stats')||'{}'));
  document.getElementById('limitChoices').checked=localStorage.getItem('fp_limit')!=='0';
}catch(e){}
if(!sel.size)sel=new Set(ALLSUBS.filter(s=>s.key.startsWith('africa')).map(s=>s.key)); // default start
const save=()=>{try{localStorage.setItem('fp_sel',JSON.stringify([...sel]));localStorage.setItem('fp_stats',JSON.stringify(stats))}catch(e){}};

const pool=()=>[...new Set(ALLSUBS.filter(s=>sel.has(s.key)).flatMap(s=>s.list))];

/* ---------- category UI ---------- */
function renderCats(){
  const el=document.getElementById('cats');el.innerHTML='';
  GROUPS.forEach(g=>{
    const row=document.createElement('div');row.className='cat';
    const total=g.subs.reduce((n,s)=>n+s.list.length,0);
    const allOn=g.subs.every(s=>sel.has(s.key));
    row.innerHTML=`<div class="label"><b>${g.name}</b></div><div class="chips"></div>`;
    const chips=row.querySelector('.chips');
    const mk=(txt,on,cls,fn)=>{const b=document.createElement('span');b.className='chip '+cls+(on?' on':'');b.innerHTML=txt;b.onclick=fn;chips.appendChild(b)};
    if(g.subs.length>1&&g.id!=='theme')mk(`All ${g.name}<small>${total}</small>`,allOn,'all',()=>{g.subs.forEach(s=>allOn?sel.delete(s.key):sel.add(s.key));changed()});
    g.subs.forEach(s=>mk(`${s.name}<small>${s.list.length}</small>`,sel.has(s.key),'',()=>{sel.has(s.key)?sel.delete(s.key):sel.add(s.key);changed()}));
    el.appendChild(row);
  });
  document.getElementById('poolInfo').textContent=pool().length+' flags selected';
}
function changed(){save();renderCats();if(pool().length)newGame();else{document.getElementById('msg').textContent='Pick at least one category.'}}
document.getElementById('btnAll').onclick=()=>{ALLSUBS.forEach(s=>sel.add(s.key));changed()};
document.getElementById('btnNone').onclick=()=>{sel.clear();save();renderCats()};
document.getElementById('limitChoices').onchange=e=>{try{localStorage.setItem('fp_limit',e.target.checked?'1':'0')}catch(_){}};

/* ---------- map ---------- */
let world=null,features=[],featById={};
function padId(i){return i==null?null:String(i).padStart(3,'0')}
const VIEWS={africa:[17,2,46],europe:[14,53,30],asia:[90,32,62],na:[-98,37,50],sa:[-60,-18,33],oce:[155,-18,52]};
function continentOf(c){return GROUPS.find(g=>g.id!=='theme'&&g.subs.some(s=>s.sr.includes(c.sr))).id}
function drawMap(cv,code){
  const c=byCode[code],ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  ctx.fillStyle='#eef2f5';ctx.fillRect(0,0,W,H);
  if(!world)return;
  const [cx,cy,hs]=VIEWS[continentOf(c)];
  const proj=d3.geoMercator().rotate([-cx,0]).center([0,cy]).scale((W/2)/(hs*Math.PI/180)).translate([W/2,H/2]);
  const path=d3.geoPath(proj,ctx);
  ctx.lineWidth=0.5;ctx.strokeStyle='#fff';ctx.fillStyle='#cfd5db';
  for(const g of features){ctx.beginPath();path(g);ctx.fill();ctx.stroke()}
  const f=c.id?featById[c.id]:features.find(x=>x.properties.name==='Kosovo');
  if(f){ctx.beginPath();path(f);ctx.fillStyle='#d62828';ctx.fill();ctx.strokeStyle='#d62828';ctx.lineWidth=1;ctx.stroke()}
  // ring so small countries / islands can still be spotted on a continent-sized map
  const pb=f?path.bounds(f):null;
  if(!pb||!isFinite(pb[0][0])||(pb[1][0]-pb[0][0])<W*0.05){
    const p=pb&&isFinite(pb[0][0])?[(pb[0][0]+pb[1][0])/2,(pb[0][1]+pb[1][1])/2]:proj([c.ll[1],c.ll[0]]);
    if(p){ctx.beginPath();ctx.arc(p[0],p[1],W*0.045,0,7);ctx.strokeStyle='#d62828';ctx.lineWidth=2.5;ctx.stroke()}
  }
}

/* ---------- flag comparison ---------- */
// Every flag is stretched to the same 300x200 size and each pixel snapped to the nearest of 9 base colours.
// A 3x3 majority filter then removes 1px anti-aliasing seams, but keeps stars, crests and thin stripes.
const GW=300,GH=200;
const PAL=[[255,255,255],[20,20,20],[206,17,38],[255,130,0],[252,209,22],[0,150,70],[0,56,168],[129,169,215],[120,70,30]];
function rgb2lab(r,g,b){
  [r,g,b]=[r,g,b].map(v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92});
  let x=(r*.4124+g*.3576+b*.1805)/.95047,y=(r*.2126+g*.7152+b*.0722),z=(r*.0193+g*.1192+b*.9505)/1.08883;
  [x,y,z]=[x,y,z].map(v=>v>.008856?Math.cbrt(v):7.787*v+16/116);
  return[116*y-16,500*(x-y),200*(y-z)];
}
const PLAB=PAL.map(p=>rgb2lab(...p));
const snapCache=new Map();
function snap(r,g,b){
  const key=(r>>2)<<12|(g>>2)<<6|(b>>2);let v=snapCache.get(key);if(v!==undefined)return v;
  const l=rgb2lab(r,g,b);let bi=0,bd=1e9;
  for(let k=0;k<PAL.length;k++){const e=(l[0]-PLAB[k][0])**2+(l[1]-PLAB[k][1])**2+(l[2]-PLAB[k][2])**2;if(e<bd){bd=e;bi=k}}
  snapCache.set(key,bi);return bi;
}
const imgCache={},gridCache={};
function loadImg(code){return imgCache[code]||(imgCache[code]=new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src='flags/'+code+'.png'}))}
async function grid(code){
  if(gridCache[code])return gridCache[code];
  const img=await loadImg(code),cv=document.createElement('canvas');cv.width=GW;cv.height=GH;
  const x=cv.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,GW,GH);
  const d=x.getImageData(0,0,GW,GH).data,raw=new Uint8Array(GW*GH);
  for(let i=0;i<GW*GH;i++)raw[i]=d[i*4+3]<128?9:snap(d[i*4],d[i*4+1],d[i*4+2]); // 9 = outside the flag (letterboxed exceptions)
  const out=new Uint8Array(GW*GH),cnt=new Uint8Array(10);
  for(let y=0;y<GH;y++)for(let xx=0;xx<GW;xx++){
    cnt.fill(0);
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const yy=Math.min(GH-1,Math.max(0,y+j)),x2=Math.min(GW-1,Math.max(0,xx+i));cnt[raw[yy*GW+x2]]++}
    let m=raw[y*GW+xx];for(let k=0;k<10;k++)if(cnt[k]>cnt[m])m=k;out[y*GW+xx]=m;
  }
  return gridCache[code]=out;
}
// Pure green/black mask: green where the guess has the same colour in the same spot as the answer, black elsewhere.
async function compare(guess,answer,cv){
  const [a,b]=await Promise.all([grid(guess),grid(answer)]);
  cv.width=GW;cv.height=GH;const x=cv.getContext('2d');
  const im=x.createImageData(GW,GH);let m=0;
  for(let i=0;i<GW*GH;i++){
    const ok=a[i]===b[i];if(ok)m++;
    im.data[i*4]=ok?120:17;im.data[i*4+1]=ok?176:17;im.data[i*4+2]=ok?90:17;im.data[i*4+3]=255;
  }
  x.putImageData(im,0,0);
  return Math.round(m/(GW*GH)*100);
}

/* ---------- game ---------- */
const $=id=>document.getElementById(id);
function newGame(){
  const p=pool();if(!p.length)return;
  let code;do{code=p[Math.floor(Math.random()*p.length)]}while(p.length>1&&target&&code===target.c);
  target=byCode[code];guessed=[];over=false;
  $('guesses').innerHTML='';
  $('answer').classList.remove('show');
  $('btnNext').style.display='none';$('btnGuess').style.display='';$('btnGive').style.display='';
  $('q').disabled=false;$('q').value='';$('msg').textContent='Guess the mystery flag. Green cells show where your guess matches it.';$('msg').className='msg';
  $('q').focus();closeDD();renderStats();
}
function renderStats(){
  const avg=stats.wins?(stats.guesses/stats.wins).toFixed(1):'–';
  $('stats').innerHTML=`Solved <b>${stats.wins}</b>/${stats.games} · avg guesses <b>${avg}</b> · streak <b>${stats.streak}</b> (best ${stats.best})`;
}
function candidates(){
  const base=$('limitChoices').checked?pool():C.map(c=>c.c);
  return base.map(c=>byCode[c]).filter(c=>!guessed.includes(c.c));
}
function matchList(q){
  q=norm(q);const cand=candidates();
  if(!q)return cand.slice().sort((a,b)=>a.n.localeCompare(b.n));
  const alias=ALIAS[q];
  const sc=c=>{const n=norm(c.n);if(alias===c.c)return 0;if(n.startsWith(q))return 1;if(n.split(' ').some(w=>w.startsWith(q)))return 2;if(n.includes(q))return 3;return 9};
  return cand.map(c=>[sc(c),c]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].n.localeCompare(b[1].n)).map(x=>x[1]);
}
function openDD(){
  shown=matchList($('q').value).slice(0,60);hi=shown.length?0:-1;
  const dd=$('dd');dd.innerHTML='';
  shown.forEach((c,i)=>{const d=document.createElement('div');d.textContent=c.n;
    d.onmousedown=e=>{e.preventDefault();submit(c)};if(i===hi)d.className='sel';dd.appendChild(d)});
  dd.style.display=shown.length?'block':'none';
}
function closeDD(){$('dd').style.display='none';hi=-1}
function moveHi(d){
  const kids=[...$('dd').children];if(!kids.length)return;
  kids[hi]&&kids[hi].classList.remove('sel');hi=(hi+d+kids.length)%kids.length;kids[hi].classList.add('sel');kids[hi].scrollIntoView({block:'nearest'});
}
$('q').addEventListener('input',openDD);
$('q').addEventListener('focus',openDD);
$('q').addEventListener('click',openDD);
$('q').addEventListener('mousedown',()=>{if(document.activeElement===$('q'))openDD()});
$('q').addEventListener('blur',()=>setTimeout(closeDD,100));
$('q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();if($('dd').style.display==='none')openDD();else moveHi(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();moveHi(-1)}
  else if(e.key==='Enter'){e.preventDefault();doGuess()}
  else if(e.key==='Escape')closeDD();
});
function doGuess(){
  if(over)return;
  let c=shown[hi];
  const v=norm($('q').value);
  const exact=candidates().find(x=>norm(x.n)===v||ALIAS[v]===x.c);
  if(exact)c=exact;
  if(!c){$('msg').textContent='Pick a country from the list.';$('msg').className='msg err';return}
  submit(c);
}
$('btnGuess').onclick=doGuess;
async function submit(c){
  if(over||guessed.includes(c.c))return;
  guessed.push(c.c);$('q').value='';closeDD();$('msg').className='msg';
  const win=c.c===target.c;
  const row=document.createElement('div');row.className='row'+(win?' win':'');
  row.innerHTML=`<div class="info"><div class="rname">${c.n}</div><div class="pct"></div></div><img class="gf" src="flags/${c.c}.png" alt=""><canvas class="sim"></canvas><canvas class="map" width="360" height="240"></canvas>`;
  
  $('guesses').prepend(row);
  drawMap(row.querySelector('canvas.map'),c.c);
  const pct=await compare(c.c,target.c,row.querySelector('canvas.sim'));
  row.querySelector('.pct').textContent=win?'Correct! #'+guessed.length:pct+'% match';
  if(win)finish(true);else $('q').focus();
}
function finish(won){
  over=true;stats.games++;
  if(won){stats.wins++;stats.guesses+=guessed.length;stats.streak++;stats.best=Math.max(stats.best,stats.streak)}else stats.streak=0;
  save();renderStats();
  
  $('ansName').innerHTML=`${target.n} <span>${won?'– solved in '+guessed.length+(guessed.length===1?' guess':' guesses'):'– the answer'}</span>`;
  $('ansFlag').src='flags/'+target.c+'.png';
  $('answer').classList.add('show');
  drawMap($('ansMap'),target.c);
  $('btnNext').style.display='';$('btnGuess').style.display='none';$('btnGive').style.display='none';$('q').disabled=true;
  $('msg').textContent=won?'Nice! Click “Next flag” (or press Enter).':'Gave up – study the map and flag, then try the next one.';
  setTimeout(()=>$('btnNext').focus(),0);
}
$('btnGive').onclick=()=>{if(!over)finish(false)};
$('btnNext').onclick=newGame;

/* ---------- sidebar ---------- */
try{const o=localStorage.getItem('fp_side');if(o==='0'||(o===null&&innerWidth<1180))document.body.classList.add('collapsed')}catch(e){}
$('tab').onclick=()=>{const c=document.body.classList.toggle('collapsed');try{localStorage.setItem('fp_side',c?'0':'1')}catch(e){}};
/* ---------- boot ---------- */
renderCats();renderStats();newGame();
fetch('lib/countries-50m.json').then(r=>r.json()).then(t=>{
  world=t;features=topojson.feature(t,t.objects.countries).features;
  features=features.filter(f=>f.properties.name!=='Antarctica');
  features.forEach(f=>{if(f.id!=null)featById[padId(f.id)]=f});
  // redraw any maps already requested
  document.querySelectorAll('.row').forEach((r,i)=>{});
  guessedRedraw();
}).catch(()=>{$('msg').textContent='Map data failed to load – start the site with serve.py (see README).';$('msg').className='msg err'});
function guessedRedraw(){
  document.querySelectorAll('#guesses .row').forEach(r=>{
    const name=r.querySelector('.rname').textContent;
    const c=C.find(x=>x.n===name);if(c)drawMap(r.querySelector('canvas.map'),c.c);
  });
  if(over)drawMap($('ansMap'),target.c);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&over&&document.activeElement===document.body)newGame()});
</script>
